name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Report test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
