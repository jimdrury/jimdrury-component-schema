name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

      - name: Run tests
        run: yarn vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Report test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit

  plan:
    name: Plan
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      STORYBLOK_API_TOKEN: ${{ secrets.STORYBLOK_API_TOKEN }}
      STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$STORYBLOK_API_TOKEN" ] || [ -z "$STORYBLOK_SPACE_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run plan
        if: steps.creds.outputs.available == 'true'
        id: plan
        run: |
          if yarn plan 2>&1 | tee plan-raw.txt; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          sed 's/\x1b\[[0-9;]*m//g' plan-raw.txt > plan-output.txt

      - name: Prepare comment
        if: always()
        run: |
          {
            echo '### Storyblok Plan'
            echo ''
            if [ "${{ steps.creds.outputs.available }}" != "true" ]; then
              echo '> **Skipped** — `STORYBLOK_API_TOKEN` and `STORYBLOK_SPACE_ID` secrets are not configured.'
            elif [ "${{ steps.plan.outputs.success }}" != "true" ]; then
              echo '> **Failed** — the plan command exited with an error.'
              echo ''
              echo '```'
              cat plan-output.txt
              echo '```'
            else
              echo '```'
              cat plan-output.txt
              echo '```'
            fi
          } > comment.md

      - name: Post plan to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: storyblok-plan
          path: comment.md
