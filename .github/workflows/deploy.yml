name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - name: Run tests
        run: yarn test

  publish:
    name: Publish Package
    needs: [lint-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@jimdrury'
      - run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish @jimdrury/storyblok-component-schema
        run: npm publish --access public 2>&1 || echo "Already published or publish failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
